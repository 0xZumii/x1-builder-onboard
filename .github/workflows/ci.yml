name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm run typecheck

      # Drives a fake `solana` binary through the account-data-too-small
      # failure. Needs no toolchain and no chain access.
      - run: npm run test:recovery

  network:
    # Live checks against the public X1 testnet. Kept separate and non-blocking:
    # a rate limit or an outage upstream should not fail the build.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm run verify
